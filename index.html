/*
  Star English v8 — práctica para Majo (Oxford "Bright", Starter–Unit 3)
  · Basada en el temario de la evaluación integradora (3/7) y los errores
    reales corregidos en el cuaderno.
  · NUEVO: temas de Unit 3 y del temario — prepositions of place, mini-lecturas
    de comprensión, wearing + jobs en 3ª persona, breakfast & how do you come
    to school, y "Answer about you" (Yes, I do / Yes, I am / Yes, I have).
  · NUEVO: 3 tipos de ejercicio — elegir (multiple choice), ORDENAR palabras
    (con distractores tipo "I'm" que hay que dejar afuera) y ESCRIBIR la palabra.
  · NUEVO: Today's session sube de dificultad sola (elige → ordena → escribe).
  · NUEVO: selector Easy/Hard para las misiones sueltas.
  · v9: la sesión en curso se guarda y se retoma si se cierra la app;
    opciones más difíciles (3-4 por pregunta, con trampas sutiles);
    ajustes para pantalla de teléfono (safe-area, 100dvh).
  · v10: prepositions con MAPA (la respuesta ya no está literal en la pregunta);
    edades en palabras en los textos y en números en las opciones;
    Progress con resumen semanal y "Practise these" (temas con más errores);
    las sesiones evitan repetir preguntas de sesiones recientes.
  · Mantiene las claves de guardado "v5" para conservar el progreso ya hecho.
*/

function Icon({ name, size = 64 }) {
  if (!ICON[name]) return null;
  return <span style={{ display: "inline-flex", lineHeight: 0 }} dangerouslySetInnerHTML={{ __html: `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${ICON[name]}</svg>` }} />;
}

// ---------- escenas de preposiciones (pelota y caja) ----------
const BALL = (cx,cy,r=8) => `<circle cx="${cx}" cy="${cy}" r="${r}" stroke="#2B2150" stroke-width="3.2" fill="#FFC233"/>`;
const BOX = (x,y,w,h) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" ${A}/>`;
const PREPSVG = {
  "on": BOX(32,50,36,28)+BALL(50,42),
  "in": BOX(32,44,36,30)+BALL(50,60),
  "under": BOX(32,34,36,26)+`<path ${A} d="M36 60 L36 80 M64 60 L64 80"/>`+BALL(50,72),
  "above": BOX(32,54,36,26)+BALL(50,26),
  "behind": BALL(64,42,9)+BOX(28,46,38,30),
  "in front of": BOX(30,34,40,32)+BALL(50,64,9),
  "between": BOX(10,46,26,26)+BOX(64,46,26,26)+BALL(50,64,9),
  "next to": BOX(26,44,32,28)+BALL(74,64,9),
};
const PREPS = Object.keys(PREPSVG);
function PrepScene({ prep, size = 110 }) {
  const inner = PREPSVG[prep]; if (!inner) return null;
  return <span style={{ display:"inline-flex", lineHeight:0 }} dangerouslySetInnerHTML={{ __html: `<svg viewBox="0 0 100 100" width="${size}" height="${size}"><path d="M8 84 L92 84" stroke="#cfd8f5" stroke-width="3" stroke-linecap="round"/>${inner}</svg>` }} />;
}
function MapScene({ places }) {
  const cell = (p, i) => (
    <div key={i} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:0, width:"33%" }}>
      <Icon name={p.icon} size={44} />
      <span style={{ fontSize:10.5, fontWeight:700, color:"#5a5482" }}>{p.w}</span>
    </div>
  );
  return (
    <div style={{ marginBottom: 8 }}>
      <div style={{ display:"flex", justifyContent:"space-between" }}>{places.slice(0, 3).map(cell)}</div>
      <div style={{ height:12, margin:"6px 2px", borderTop:"3px solid #cfd8f5", borderBottom:"3px solid #cfd8f5", display:"flex", alignItems:"center", justifyContent:"center" }}><span style={{ width:"90%", borderTop:"2px dashed #cfd8f5" }} /></div>
      <div style={{ display:"flex", justifyContent:"space-between" }}>{places.slice(3).map(cell)}</div>
    </div>
  );
}

// ---------- utilidades aleatorias ----------
const pick = (a) => a[(Math.random() * a.length) | 0];
const coin = () => Math.random() < 0.5;
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [b[i], b[j]] = [b[j], b[i]]; } return b; }
const pickBut = (a, notVal) => { let x = pick(a); let g = 0; while (x === notVal && g++ < 20) x = pick(a); return x; };
const normalize = (s) => String(s == null ? "" : s).toUpperCase().replace(/[’‘]/g,"'").replace(/\s+/g," ").trim();
const sig = (q) => (q.text || "") + "|" + (q.context || "") + "|" + q.answer + "|" + (q.type || "mc") + "|" + (q.pics ? q.pics.join(",") : "") + "|" + (q.prepScene || "") + (q.swatch || "");
const isCorrect = (q, val) => q.type === "spell" ? normalize(val) === normalize(q.answer) : val === q.answer;

// arma un ejercicio de ordenar palabras; decoys = fichas trampa que sobran
function orderQ({ sentence, decoys = [], context, ask, pics, badge, tip, prepScene }) {
  return { type:"order", words: shuffle([...sentence.split(" "), ...decoys]), answer: sentence, context, ask: ask || "Tap the words in order.", pics, badge, tip, prepScene };
}

// ---------- bancos de contenido ----------
const SING = [ {w:"park",icon:"tree"}, {w:"castle",icon:"castle"}, {w:"shop",icon:"shop"}, {w:"school",icon:"house"}, {w:"hospital",icon:"house"}, {w:"station",icon:"house"} ];
const PLUR = [ {w:"shops",icon:"shop"}, {w:"cars",icon:"car"}, {w:"buses",icon:"bus"}, {w:"parks",icon:"tree"}, {w:"houses",icon:"house"}, {w:"trees",icon:"tree"} ];
const FEEL = [ {w:"happy",icon:"facehappy"}, {w:"sad",icon:"facesad"}, {w:"hungry",icon:"facehungry"}, {w:"scared",icon:"facescared"}, {w:"angry",icon:"faceangry"} ];
const LIKEABLE = [ {w:"pizza"}, {w:"apples",icon:"apple"}, {w:"football",icon:"football"}, {w:"dogs",icon:"dog"}, {w:"soup"}, {w:"bananas"} ];
const ACTIONS = [ {w:"swim",icon:"swim"}, {w:"ride a bike",icon:"bike"}, {w:"run"}, {w:"dance"}, {w:"jump"}, {w:"sing"} ];

const VEH = [ {s:"car",p:"cars",icon:"car"}, {s:"bus",p:"buses",icon:"bus"}, {s:"train",p:"trains",icon:"train"}, {s:"plane",p:"planes",icon:"plane"}, {s:"lorry",p:"lorries",icon:"lorry"}, {s:"motorbike",p:"motorbikes",icon:"motorbike"}, {s:"bike",p:"bikes",icon:"bike"} ];

const MONTHS = ["January","March","May","July","September","December"];
const NAMES = ["Sara","Mia","Tom","Lily","Ben","Nina"];
const SPELL = [
  {w:"castle",icon:"castle",d:["castel","casle"]}, {w:"painting",icon:"painting",d:["paiting","paintin"]},
  {w:"scientist",icon:"flask",d:["sientist","scientistc"]}, {w:"brother",icon:"boy",d:["broder","bruther"]},

];

const CLOTHES_SPELL = CLOTHES.filter((c) => c.w !== "t-shirt");
const CITY = [ {w:"park",icon:"tree"}, {w:"school",icon:"house"}, {w:"shop",icon:"shop"}, {w:"castle",icon:"castle"}, {w:"cinema",icon:"house"}, {w:"museum",icon:"house"}, {w:"hospital",icon:"house"}, {w:"station",icon:"house"} ];

const NUMW = { 7:"seven", 8:"eight", 9:"nine", 10:"ten", 11:"eleven", 12:"twelve" };

// ---------- generadores (una pregunta por llamada; mode = mc | order | spell) ----------
function oneThereIs(mode) {
  const singular = coin(), yes = coin();
  const pl = singular ? pick(SING) : pick(PLUR);
  const qtext = singular ? `Is there a ${pl.w}?` : `Are there any ${pl.w}?`;
  const answer = singular ? (yes ? "Yes, there is." : "No, there isn't.") : (yes ? "Yes, there are." : "No, there aren't.");
  const wrongVerb = singular ? (yes ? "are." : "aren't.") : (yes ? "is." : "isn't.");
  const pics = singular ? [pl.icon] : [pl.icon, pl.icon];
  const tip = singular ? "One thing → there is / there isn't." : "Many things → there are / there aren't.";
  if (mode === "order") return orderQ({ sentence: answer, decoys: [wrongVerb], pics, badge: yes?"yes":"no", context: qtext, tip });
  return { pics, badge: yes?"yes":"no", text: qtext, options: shuffle(["Yes, there is.","Yes, there are.","No, there isn't.","No, there aren't."]), answer, tip };
}
function oneILike(mode) {
  if (mode === "order") {
    const t = (Math.random() * 4) | 0;
    if (t === 0) { const x = pick(LIKEABLE); return orderQ({ sentence:`I like ${x.w}.`, decoys:["I'm"], pics: x.icon?[x.icon]:undefined, tip:"I like — without I'm." }); }
    if (t === 1) { const a = pick(ACTIONS); return orderQ({ sentence:`I can ${a.w}.`, decoys:["I'm"], pics: a.icon?[a.icon]:undefined, tip:"I can — without I'm." }); }
    if (t === 2) { const o = pick(HAVE); return orderQ({ sentence:`I've got ${o.w}.`, decoys:["I'm"], pics: o.icon?[o.icon]:undefined, tip:"I've got = I have." }); }
    const f = pick(FEEL); return orderQ({ sentence:`I'm ${f.w}.`, decoys:["like"], pics:[f.icon], tip:"Feelings → I'm happy." });
  }
  const t = (Math.random() * 5) | 0;
  if (t === 0) { const f = pick(FEEL); return { pics:[f.icon], text:`I ___ ${f.w}.`, options: shuffle(["I'm","I like","I can"]), answer:"I'm", tip:"Use I'm for feelings: I'm happy." }; }
  if (t === 1) { const x = pick(LIKEABLE); return { pics: x.icon?[x.icon]:undefined, text:`I ___ ${x.w}.`, options: shuffle(["I like","I'm like","I'm"]), answer:"I like", tip:"Use I like with a word." }; }
  if (t === 2) { const a = pick(ACTIONS); return { pics: a.icon?[a.icon]:undefined, text:`I ___ ${a.w}.`, options: shuffle(["I can","I'm can","I like"]), answer:"I can" }; }
  if (t === 3) { const o = pick(HAVE); return { pics: o.icon?[o.icon]:undefined, text:`I ___ ${o.w}.`, options: shuffle(["I've got","I'm have","I'm got"]), answer:"I've got", tip:"I've got = I have." }; }
  const p = pick(PLACES); return { text:`I ___ from ${p}.`, options: shuffle(["I'm","I like","I can"]), answer:"I'm", tip:"Use I'm from + place." };
}
function oneThisThese(mode) {
  const v = pick(VEH);
  if (mode === "order") {
    if (coin()) return orderQ({ sentence:`This is my ${v.s}.`, decoys:["These","are"], pics:[v.icon], tip:"One → This is." });
    return orderQ({ sentence:`These are my ${v.p}.`, decoys:["This","is"], pics:[v.icon, v.icon], tip:"Many → These are." });
  }
  const t = (Math.random() * 3) | 0;
  if (t === 0) return { pics:[v.icon], text:`___ a ${v.s}.`, options: shuffle(["This is","These are","This are"]), answer:"This is", tip:"One → This is." };
  if (t === 1) return { pics:[v.icon, v.icon], text:`___ my ${v.p}.`, options: shuffle(["These are","This is","These is"]), answer:"These are", tip:"Many → These are." };
  return { pics:[v.icon, v.icon], text:"These are my ___.", options: shuffle([...new Set([v.p, v.s, v.s + "s"])]), answer: v.p, tip:"Add -s for many." };
}
function oneSpell(mode, word) {
  const s = word || pick(SPELL);
  const base = s.swatch ? { swatch: s.swatch } : { pics: [s.icon] };
  if (mode === "spell") return { ...base, type:"spell", ask:"Look and write the word.", answer: s.w };
  return { ...base, ask:"Which one is correct?", options: shuffle([s.w, s.d[0], s.d[1]]), answer: s.w };
}
function oneYesNo(mode) {
  const pron = coin() ? "she" : "he", otherP = pron === "she" ? "he" : "she";
  if (mode === "order") {

const MNAME = Object.fromEntries(MISSIONS.map((m) => [m.id, m.name]));

// genera un set único (sin repetir) para una misión
function genMission(id, n = MLEN, level = "easy") {
  const pattern = level === "hard" ? (SPELLABLE[id] ? ["order","mc","spell"] : ["order","mc"]) : ["mc"];
  if (id === "spell") { // sin repetir palabra
    const words = shuffle(SPELL).slice(0, Math.min(n, SPELL.length));
    return words.map((w, i) => ({ ...oneSpell(level === "hard" && i % 2 === 1 ? "spell" : "mc", w), _id:id, _mission:MNAME[id] }));
  }
  const out = [], seen = new Set();
  let guard = 0;
  while (out.length < n && guard++ < n * 14) {
    const q = GEN[id](pattern[out.length % pattern.length]); const s = sig(q);
    if (!seen.has(s)) { seen.add(s); out.push({ ...q, _id:id, _mission:MNAME[id] }); }
  }
  return out;
}

const WEIGHTS = { thereis:2, thisthese:2, spell:2, ilike:2, yesno:2, questions:1, connect:1, prep:3, reading:2, wearjobs:2, aboutyou:2, routine:1 };
const SESSION_MODES = ["mc","mc","mc","mc","order","order","order","hard","hard","hard"];
// memoria de preguntas recientes: las sesiones nuevas evitan repetir las de días anteriores
const RECENT_KEY = "majo-recent-sigs";
const loadRecent = () => { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch (e) { return []; } };
const saveRecent = (arr) => { try { localStorage.setItem(RECENT_KEY, JSON.stringify(arr.slice(-220))); } catch (e) {} };
function buildSession(n = 10) {
  const bag = []; Object.keys(WEIGHTS).forEach((id) => { for (let i = 0; i < WEIGHTS[id]; i++) bag.push(id); });
  const recentArr = loadRecent(), recent = new Set(recentArr);
  const out = [], seen = new Set(); let guard = 0;
  while (out.length < n && guard++ < n * 22) {
    const id = pick(bag);
    let mode = SESSION_MODES[out.length] || "mc";
    if (mode === "hard") mode = SPELLABLE[id] ? "spell" : "order";
    const q = GEN[id](mode);
    const s = sig(q);
    if (seen.has(s)) continue;
    if (recent.has(s) && guard < n * 16) continue; // primero intenta preguntas nunca vistas
    seen.add(s); out.push({ ...q, _id:id, _mission:MNAME[id] });
  }
  saveRecent([...recentArr, ...out.map(sig)]);
  return out;
}

  })(); }, []);
  const saveBest = async (n) => { setBest(n); try { await window.storage.set("majo-best-v5", JSON.stringify(n)); } catch (e) {} };
  const saveMeta = async (n) => { setMeta(n); try { await window.storage.set("majo-meta-v5", JSON.stringify(n)); } catch (e) {} };
  const addLog = async (rec) => { const n = [rec, ...log].slice(0, 400); setLog(n); try { await window.storage.set("majo-log-v5", JSON.stringify(n)); } catch (e) {} };
  const clearLog = async () => { setLog([]); try { await window.storage.set("majo-log-v5", JSON.stringify([])); } catch (e) {} };
  const setLevel = async (l) => { setLevelState(l); try { await window.storage.set("majo-level", l); } catch (e) {} };

  const totalStars = Object.values(best).reduce((a, b) => a + b, 0);
  const doneToday = meta.lastDay === todayStr();
  const todayCount = log.filter((r) => r.kind === "Today's session" && r.t.slice(0, 10) === todayStr()).length;

  const startMission = (id) => { const qs2 = genMission(id, MLEN, level); setQs(qs2); setTitle(MNAME[id]); setIsSession(false); setMissionId(id); setRetrying(false); setResumePlay(null);
    saveGame({ qs: qs2, title: MNAME[id], isSession: false, missionId: id, retrying: false, first: { correct:0, total:0, wrong:[] }, play: { qi:0, correct:0, wrong:[] } }); setScreen("play"); };
  const startSession = () => { const qs2 = buildSession(10); setQs(qs2); setTitle("Today's session"); setIsSession(true); setMissionId(null); setRetrying(false); setResumePlay(null);
    saveGame({ qs: qs2, title: "Today's session", isSession: true, missionId: null, retrying: false, first: { correct:0, total:0, wrong:[] }, play: { qi:0, correct:0, wrong:[] } }); setScreen("play"); };

  const closeSession = (c, t, wrongArr, results) => {
    clearGame();
    const last = meta.lastDay; let streak = meta.streak || 0;
    if (last !== todayStr()) streak = (last === yestStr()) ? streak + 1 : 1;
    saveMeta({ streak, lastDay: todayStr(), sessions: (meta.sessions || 0) + 1 });
    addLog({ t: new Date().toISOString(), kind: "Today's session", correct: c, total: t, wrong: packWrong(wrongArr), results: results || [] });
    setFinalCorrect(c); setFinalTotal(t); setScreen("end");
  };
  const onFinish = (correct, total, wrong, results) => {
    if (isSession) {
      if (!retrying) { setFirst({ correct, total, wrong, results }); if (wrong.length > 0) { setRetrying(true); setQs(wrong); setTitle("Try again!"); setResumePlay(null);
          saveGame({ qs: wrong, title: "Try again!", isSession: true, missionId: null, retrying: true, first: { correct, total, wrong, results }, play: { qi:0, correct:0, wrong:[], results:[] } }); return; }
        closeSession(correct, total, [], results); }
      else { closeSession(first.correct, first.total, first.wrong, first.results); }
    } else {
      clearGame();
      const prev = best[missionId] || 0; if (correct > prev) saveBest({ ...best, [missionId]: correct });
      addLog({ t: new Date().toISOString(), kind: title, correct, total, wrong: packWrong(wrong), results: results || [] });
      setFinalCorrect(correct); setFinalTotal(total); setScreen("end");
    }
  };

  const bg = `radial-gradient(120% 90% at 50% 0%, ${C.sky2} 0%, ${C.sky1} 60%, #B9C8FF 100%)`;
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: bg, fontFamily: "'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif", color: C.ink, padding: "calc(12px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom))" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
        @keyframes lumiBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.15)}60%{transform:translateY(0) scale(.96)}100%{transform:translateY(0) scale(1)}}
        @keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
        @keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
        @media (prefers-reduced-motion: reduce){*{animation:none!important}}
        .tap{transition:transform .08s ease, box-shadow .12s ease;} .tap:active{transform:translateY(2px);}
        .opt:focus-visible{outline:3px solid ${C.grape};outline-offset:2px;}
      `}</style>

      <div className="w-full" style={{ maxWidth: 440 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 14 }}>
          <div className="flex items-center" style={{ gap: 8 }}><StarSvg size={30} face /><span style={{ fontWeight: 700, fontSize: 22 }}>Star English</span></div>
          <div className="flex items-center" style={{ gap: 6, background:"#fff", borderRadius:999, padding:"6px 12px", boxShadow:"0 3px 0 rgba(43,33,80,.15)", fontWeight:700 }}><StarSvg size={20} /> <span style={{ fontSize: 16 }}>{totalStars}</span></div>
        </div>

        {screen === "home" && <Home best={best} meta={meta} doneToday={doneToday} todayCount={todayCount} level={level} setLevel={setLevel} onStart={startMission} onSession={startSession} onProgress={() => setScreen("progress")} />}
        {screen === "play" && <Play qs={qs} title={title} isSession={isSession} initial={resumePlay} onSave={(p) => saveGame({ qs, title, isSession, missionId, retrying, first, play: p })} onFinish={onFinish} onHome={() => { clearGame(); setResumePlay(null); setScreen("home"); }} />}
        {screen === "end" && <End isSession={isSession} title={title} correct={finalCorrect} total={finalTotal} streak={meta.streak} onAgain={() => (isSession ? startSession() : startMission(missionId))} onHome={() => setScreen("home")} onProgress={() => setScreen("progress")} />}
        {screen === "progress" && <Progress log={log} meta={meta} totalStars={totalStars} onClear={clearLog} onStart={startMission} onHome={() => setScreen("home")} />}

        <div style={{ textAlign: "center", marginTop: 14, fontSize: 11, color: "#9a93c0" }}>Star English · {VERSION}</div>
      </div>
    </div>
  );
}

function Home({ best, meta, doneToday, todayCount, level, setLevel, onStart, onSession, onProgress }) {
  return (
    <div style={{ animation: "popIn .25s ease" }}>
      <div className="flex items-center" style={{ gap: 12, background:"#fff", borderRadius:22, padding:"14px 16px", marginBottom:12, boxShadow:"0 4px 0 rgba(43,33,80,.12)" }}>
        <StarSvg size={42} face bounce />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 19 }}>Hi Majo! 👋</div>
          <div style={{ fontSize: 13.5, color: "#6a6390" }}>{meta.streak > 0 ? `🔥 ${meta.streak}-day streak` : "Let's start a streak! 🔥"}</div>
        </div>
        <button onClick={onProgress} className="tap" style={{ border:"none", background:"#F2EFFF", color:C.grape, fontWeight:800, borderRadius:14, padding:"8px 12px", cursor:"pointer", fontSize:13 }}>📊 Progress</button>
      </div>

      <button onClick={onSession} className="tap opt" style={{ width:"100%", textAlign:"left", border:"none", borderRadius:22, padding:"16px 18px", cursor:"pointer", color:"#fff", background:`linear-gradient(135deg, ${C.grape}, #8a6bff)`, boxShadow:`0 5px 0 ${C.grapeDark}`, marginBottom:16, display:"flex", alignItems:"center", gap:14 }}>
        <div style={{ fontSize: 34 }}>{doneToday ? "🌟" : "⭐"}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 18 }}>{doneToday ? "New session" : "Today's session"}</div>
          <div style={{ fontSize: 13, opacity: .92 }}>{doneToday ? `${todayCount} done today — start another! · 10 new questions` : "10 new questions · 3–5 min"}</div>
        </div>
        <div style={{ fontSize: 22 }}>▶</div>
      </button>

      <div className="flex items-center justify-between" style={{ margin: "0 2px 8px" }}>
        <div style={{ fontSize: 13, fontWeight: 700, color: "#6a6390" }}>Or practise one thing:</div>
        <div className="flex items-center" style={{ gap: 3, background:"#fff", borderRadius:999, padding:3, boxShadow:"0 2px 0 rgba(43,33,80,.1)" }}>
          {["easy","hard"].map((l) => (
            <button key={l} onClick={() => setLevel(l)} className="tap" style={{ border:"none", borderRadius:999, padding:"5px 10px", fontSize:12, fontWeight:800, cursor:"pointer", fontFamily:"inherit", background: level === l ? C.grape : "transparent", color: level === l ? "#fff" : "#7a7398" }}>{l === "easy" ? "🙂 Easy" : "🔥 Hard"}</button>
          ))}
        </div>
      </div>
      <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {MISSIONS.map((m) => {
          const b = best[m.id] || 0;
          return (
            <button key={m.id} onClick={() => onStart(m.id)} className="tap opt" style={{ textAlign:"left", background:"#fff", border:"none", borderRadius:20, padding:14, cursor:"pointer", boxShadow:"0 4px 0 rgba(43,33,80,.12)", display:"flex", flexDirection:"column", gap:6, minHeight:120 }}>
              <div style={{ fontSize: 28 }}>{m.emoji}</div>
              <div style={{ fontWeight: 700, fontSize: 14, lineHeight: 1.1 }}>{m.name}</div>
              <div style={{ fontSize: 11.5, color: "#7a7398", flex: 1 }}>{m.sub}</div>
              <div className="flex items-center" style={{ gap: 4, fontSize: 12, fontWeight: 700, color: b ? C.grape : "#b9b4cf" }}><StarSvg size={15} color={b ? C.sun : "#dcd8ee"} /> best {b}/{MLEN}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Play({ qs, title, isSession, initial, onSave, onFinish, onHome }) {
  const [qi, setQi] = useState(initial ? initial.qi : 0);
  const [picked, setPicked] = useState(null);
  const [correct, setCorrect] = useState(initial ? initial.correct : 0);
  const [wrong, setWrong] = useState(initial && initial.wrong ? initial.wrong : []);
  const [results, setResults] = useState(initial && initial.results ? initial.results : []);
  const [cheer, setCheer] = useState("");
  const [pop, setPop] = useState(false);
  const [placed, setPlaced] = useState([]);
  const [typed, setTyped] = useState("");
  const skipReset = React.useRef(!!initial);
  useEffect(() => { if (skipReset.current) { skipReset.current = false; return; } setQi(0); setPicked(null); setCorrect(0); setWrong([]); setResults([]); setCheer(""); setPlaced([]); setTyped(""); }, [qs]);

  const q = qs[qi]; if (!q) return null;
  const total = qs.length;
  const isRight = picked !== null && isCorrect(q, picked);
  const isWrong = picked !== null && !isCorrect(q, picked);
  const ask = q._ask || q.ask;
  const orderTokens = q.type === "order" ? q.answer.split(" ") : null;

  const finish = (val) => {
    if (picked !== null) return;
    setPicked(val);
    const ok = isCorrect(q, val);
    setResults((r) => [...r, { t: q._id, ok: ok ? 1 : 0 }]);
    if (ok) { setCorrect((c) => c + 1); setCheer(CHEERS[Math.floor(Math.random() * CHEERS.length)]); setPop(true); setTimeout(() => setPop(false), 650); }
    else { setWrong((w) => [...w, q]); setCheer("Almost! Look →"); }
  };
  const addWord = (i) => {
    if (picked !== null) return;
    const np = [...placed, i];
    setPlaced(np);
    if (np.length === orderTokens.length) finish(np.map((ix) => q.words[ix]).join(" "));
  };
  const removeWord = (pos) => { if (picked !== null) return; setPlaced(placed.filter((_, j) => j !== pos)); };
  const next = () => { if (qi + 1 < total) { if (onSave) onSave({ qi: qi + 1, correct, wrong, results }); setQi(qi + 1); setPicked(null); setCheer(""); setPlaced([]); setTyped(""); } else { onFinish(correct, total, wrong, results); } };

  const chipBase = { border:"none", borderRadius:14, padding:"10px 14px", fontSize:17, fontWeight:600, fontFamily:"inherit", cursor:"pointer" };

  return (
    <div style={{ animation: "popIn .2s ease" }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 10 }}>
        <button onClick={onHome} className="tap" style={{ border:"none", background:"#fff", borderRadius:999, width:40, height:40, cursor:"pointer", fontSize:18, boxShadow:"0 3px 0 rgba(43,33,80,.12)" }}>←</button>
        <div className="flex items-center" style={{ gap: 5 }}>{Array.from({ length: total }).map((_, i) => (<span key={i} style={{ width: 9, height: 9, borderRadius: 99, background: i < qi ? C.grass : i === qi ? C.grape : "#fff", boxShadow:"0 2px 0 rgba(43,33,80,.1)" }} />))}</div>
        <div style={{ fontWeight: 700, fontSize: 14, width: 40, textAlign: "right" }}>{qi + 1}/{total}</div>
      </div>

      {isSession && <div style={{ textAlign: "center", fontSize: 12.5, fontWeight: 700, color: C.grape, marginBottom: 6 }}>{title}{q._mission ? ` · ${q._mission}` : ""}</div>}

      <div className="flex items-center" style={{ gap: 10, minHeight: 44, marginBottom: 8 }}>
        <StarSvg size={38} face bounce={pop} color={isWrong ? C.coral : C.sun} />
        <div style={{ fontWeight: 700, fontSize: 17, color: isRight ? C.grass : isWrong ? C.coral : C.ink, position: "relative" }}>
          {cheer || (isSession ? "Keep going!" : title)}
          {pop && (<span style={{ position: "absolute", left: 18, top: -6 }}>{["⭐","✨","⭐"].map((s, i) => (<span key={i} style={{ position: "absolute", left: i * 16, animation: "floatUp .65s ease forwards", animationDelay: `${i * 60}ms` }}>{s}</span>))}</span>)}
        </div>
      </div>

      <div style={{ background:"#fff", borderRadius:24, padding:18, boxShadow:"0 5px 0 rgba(43,33,80,.12)", animation: isWrong ? "shake .4s ease" : "none", marginBottom:14 }}>
        {q.pics && (<div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:10, marginBottom:8 }}><span style={{ position:"relative", display:"inline-flex", gap:6 }}>{q.pics.map((n, i) => <Icon key={i} name={n} size={66} />)}{q.badge && <Badge kind={q.badge} />}</span></div>)}
        {q.prepScene && (<div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}><span style={{ position:"relative", display:"inline-flex" }}><PrepScene prep={q.prepScene} />{q.badge && <Badge kind={q.badge} />}</span></div>)}
        {q.mapScene && <MapScene places={q.mapScene} />}
        {q.swatch && (<div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}><span style={{ width:56, height:56, borderRadius:"50%", background:q.swatch, border:"3px solid #2B2150" }} /></div>)}
        {q.context && <div style={{ fontSize:16, textAlign:"center", color:"#5a5482", marginBottom:6, lineHeight:1.45 }}>{q.context}</div>}
        {ask && <div style={{ fontSize:14.5, color:"#6a6390", textAlign:"center", marginBottom: q.text ? 4 : 0 }}>{ask}</div>}
        {q.text && <div style={{ fontSize:21, fontWeight:600, textAlign:"center", lineHeight:1.3 }}>{q.text}</div>}
      </div>

      {q.type === "order" ? (
        <div>
          <div style={{ minHeight: 58, background:"rgba(255,255,255,.72)", border:`2px dashed ${isRight ? C.grass : isWrong ? C.coral : "#b9c4ee"}`, borderRadius:16, padding:8, display:"flex", flexWrap:"wrap", gap:8, alignItems:"center", marginBottom:12 }}>
            {placed.length === 0 && <span style={{ color:"#9a93c0", fontSize:13, margin:"0 auto" }}>Tap the words below…</span>}
            {placed.map((ix, pos) => (
              <button key={pos} onClick={() => removeWord(pos)} className="tap" disabled={picked !== null} style={{ ...chipBase, background: picked !== null ? (isRight ? C.grass : C.coral) : C.grape, color:"#fff", boxShadow:`0 3px 0 ${picked !== null ? (isRight ? "#259652" : "#d94f4f") : C.grapeDark}`, cursor: picked !== null ? "default" : "pointer" }}>{q.words[ix]}</button>
            ))}
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:8, justifyContent:"center" }}>
            {q.words.map((w, i) => placed.includes(i) ? null : (
              <button key={i} onClick={() => addWord(i)} className="tap opt" disabled={picked !== null} style={{ ...chipBase, background:"#fff", color: picked !== null ? "#b4afca" : C.ink, boxShadow:"0 3px 0 rgba(43,33,80,.14)", cursor: picked !== null ? "default" : "pointer" }}>{w}</button>
            ))}
          </div>
        </div>
      ) : q.type === "spell" ? (
        <div className="flex" style={{ gap: 8 }}>
          <input value={typed} disabled={picked !== null} onChange={(e) => setTyped(e.target.value)} onKeyDown={(e) => { if (e.key === "Enter" && typed.trim()) finish(typed.trim()); }} autoCapitalize="off" autoCorrect="off" spellCheck={false} placeholder="Write here…" style={{ flex:1, minWidth:0, fontSize:20, fontWeight:600, padding:"13px 14px", borderRadius:16, border:`3px solid ${picked !== null ? (isRight ? C.grass : C.coral) : "#fff"}`, boxShadow:"0 4px 0 rgba(43,33,80,.14)", fontFamily:"inherit", color:C.ink, outline:"none", background:"#fff" }} />
          {picked === null && <button onClick={() => typed.trim() && finish(typed.trim())} className="tap" style={{ background:C.grape, color:"#fff", border:"none", borderRadius:16, padding:"0 20px", fontSize:17, fontWeight:700, cursor:"pointer", boxShadow:`0 4px 0 ${C.grapeDark}`, fontFamily:"inherit" }}>OK</button>}
        </div>
      ) : (
        <div className="flex" style={{ flexDirection: "column", gap: 10 }}>
          {q.options.map((opt) => {
            let bg = "#fff", fg = C.ink, shadow = "0 4px 0 rgba(43,33,80,.14)", border = "3px solid #fff";
            if (picked !== null) {
              if (opt === q.answer) { bg = C.grass; fg = "#fff"; shadow = "0 4px 0 #259652"; border = `3px solid ${C.grass}`; }
              else if (opt === picked) { bg = C.coral; fg = "#fff"; shadow = "0 4px 0 #d94f4f"; border = `3px solid ${C.coral}`; }
              else { fg = "#b4afca"; }
            }
            return (<button key={opt} className="tap opt" onClick={() => finish(opt)} disabled={picked !== null} style={{ background:bg, color:fg, border, borderRadius:16, padding:"15px 16px", fontSize:18, fontWeight:600, cursor: picked !== null ? "default" : "pointer", boxShadow:shadow, fontFamily:"inherit" }}>{opt}</button>);
          })}
        </div>
      )}

      {picked !== null && (
        <div style={{ marginTop: 14, animation: "popIn .2s ease" }}>
          {isWrong && <div style={{ textAlign: "center", fontWeight: 600, marginBottom: 8 }}>✅ {q.answer}</div>}
          {q.tip && <div style={{ background:"#FFF6DC", border:`2px solid ${C.sun}`, borderRadius:14, padding:"10px 12px", fontSize:13.5, textAlign:"center", marginBottom:10 }}>💡 {q.tip}</div>}
          <button onClick={next} className="tap" style={{ width:"100%", background:C.grape, color:"#fff", border:"none", borderRadius:16, padding:"15px", fontSize:18, fontWeight:700, cursor:"pointer", boxShadow:`0 4px 0 ${C.grapeDark}`, fontFamily:"inherit" }}>{qi + 1 < total ? "Next →" : "Finish ⭐"}</button>
        </div>
      )}
    </div>
  );
}

function End({ isSession, title, correct, total, streak, onAgain, onHome, onProgress }) {
  const perfect = correct === total, good = correct >= Math.ceil(total * 0.6);
  const msg = perfect ? "Perfect! 🌟" : good ? "Great job! 👏" : "Good try! 💪";
  return (
    <div style={{ textAlign: "center", animation: "popIn .25s ease" }}>
      <div style={{ background:"#fff", borderRadius:26, padding:"26px 18px", boxShadow:"0 5px 0 rgba(43,33,80,.12)", marginTop:10 }}>
        <StarSvg size={70} face bounce />
        <div style={{ fontWeight: 700, fontSize: 24, marginTop: 8 }}>{msg}</div>
        <div style={{ fontSize: 16, color: "#6a6390", marginTop: 4 }}>{isSession ? "Session complete" : title}</div>
        <div className="flex items-center justify-center" style={{ gap: 6, marginTop: 14, flexWrap: "wrap" }}>{Array.from({ length: total }).map((_, i) => (<StarSvg key={i} size={20} color={i < correct ? C.sun : "#e3dff3"} />))}</div>
        <div style={{ fontWeight: 700, fontSize: 20, marginTop: 10 }}>{correct} / {total} ⭐</div>
        {isSession && streak > 0 && <div style={{ marginTop: 10, fontWeight: 800, fontSize: 17, color: C.coral }}>🔥 {streak}-day streak!</div>}
      </div>
      <div className="flex" style={{ gap: 10, marginTop: 14 }}>
        <button onClick={onAgain} className="tap" style={{ flex:1, background:C.grape, color:"#fff", border:"none", borderRadius:16, padding:"15px", fontSize:17, fontWeight:700, cursor:"pointer", boxShadow:`0 4px 0 ${C.grapeDark}`, fontFamily:"inherit" }}>{isSession ? "New session" : "New questions ↻"}</button>
        <button onClick={onHome} className="tap" style={{ flex:1, background:"#fff", color:C.ink, border:"none", borderRadius:16, padding:"15px", fontSize:17, fontWeight:700, cursor:"pointer", boxShadow:"0 4px 0 rgba(43,33,80,.14)", fontFamily:"inherit" }}>Home</button>
      </div>
      <button onClick={onProgress} className="tap" style={{ marginTop:10, background:"transparent", border:"none", color:C.grape, fontWeight:700, cursor:"pointer", fontSize:14 }}>📊 See progress</button>
    </div>
  );
}

function Progress({ log, meta, totalStars, onClear, onStart, onHome }) {
  const dayLabel = (iso) => { const d = iso.slice(0, 10); if (d === todayStr()) return "Today"; if (d === yestStr()) return "Yesterday"; return d; };
  const timeLabel = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const groups = []; const idx = {};
  log.forEach((r) => { const d = r.t.slice(0, 10); if (!(d in idx)) { idx[d] = groups.length; groups.push({ d, items: [] }); } groups[idx[d]].items.push(r); });
  const scoreColor = (c, t) => (c === t ? C.grass : c >= Math.ceil(t * 0.6) ? C.sun : C.coral);

  // resumen semanal + temas con más errores (últimos 15 registros)
  const weekAgo = Date.now() - 7 * 86400000;
  const week = log.filter((r) => { try { return new Date(r.t).getTime() > weekAgo; } catch (e) { return false; } });
  const weekSessions = week.filter((r) => r.kind === "Today's session").length;
  const weekAvg = week.length ? Math.round(100 * week.reduce((a, r) => a + (r.total ? r.correct / r.total : 0), 0) / week.length) : 0;
  const MID = Object.fromEntries(MISSIONS.map((m) => [m.name, m.id]));
  const mist = {};
  log.slice(0, 15).forEach((r) => (r.wrong || []).forEach((w) => { if (w.topic) mist[w.topic] = (mist[w.topic] || 0) + 1; }));
  const focus = Object.entries(mist).sort((a, b) => b[1] - a[1]).slice(0, 3);

  return (
    <div style={{ animation: "popIn .2s ease" }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 12 }}>
        <button onClick={onHome} className="tap" style={{ border:"none", background:"#fff", borderRadius:999, width:40, height:40, cursor:"pointer", fontSize:18, boxShadow:"0 3px 0 rgba(43,33,80,.12)" }}>←</button>
        <div style={{ fontWeight: 800, fontSize: 19 }}>Progress</div>
        <div style={{ width: 40 }} />
      </div>

      <div className="flex" style={{ gap: 10, marginBottom: 14 }}>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.coral }}>🔥 {meta.streak || 0}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>day streak</div></div>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.grape }}>{meta.sessions || 0}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>sessions</div></div>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.sun }}>★ {totalStars}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>best stars</div></div>
      </div>

      {week.length > 0 && (<div style={{ textAlign:"center", fontSize:13, color:"#6a6390", marginBottom:12, fontWeight:700 }}>This week: {weekSessions} session{weekSessions === 1 ? "" : "s"} · {weekAvg}% correct</div>)}

      {focus.length > 0 && (
        <div style={{ background:"#fff", borderRadius:18, padding:"12px 14px", marginBottom:14, boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}>
          <div style={{ fontWeight:800, fontSize:14, marginBottom:8 }}>💪 Practise these:</div>
          {focus.map(([topic, n]) => (
            <button key={topic} onClick={() => MID[topic] && onStart(MID[topic])} className="tap" style={{ width:"100%", display:"flex", justifyContent:"space-between", alignItems:"center", background:"#F6F4FF", border:"none", borderRadius:12, padding:"10px 12px", marginBottom:6, cursor:"pointer", fontFamily:"inherit", fontSize:13.5, fontWeight:700, color:C.ink }}>
              <span>{topic}</span><span><span style={{ color:C.coral }}>{n} ✗</span>{MID[topic] ? <span style={{ color:C.grape }}> · Practise ▶</span> : null}</span>
            </button>
          ))}
        </div>
      )}

      {log.length === 0 && (<div style={{ background:"#fff", borderRadius:18, padding:"24px 16px", textAlign:"center", color:"#7a7398", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}>No activity yet.<br/>Do a session and it will show here! ⭐</div>)}

      {groups.map((g) => {
        const sessTotal = g.items.filter((r) => r.kind === "Today's session").length;
        let sSeen = 0;
        return (
        <div key={g.d} style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: "#6a6390", margin: "0 2px 8px" }}>{dayLabel(g.items[0].t)}</div>
          {g.items.map((r, i) => {
            const label = r.kind === "Today's session" ? `⭐ Session ${sessTotal - (sSeen++)}` : r.kind;
            return (
            <div key={i} style={{ background:"#fff", borderRadius:16, padding:"12px 14px", marginBottom:8, boxShadow:"0 3px 0 rgba(43,33,80,.1)" }}>
              <div className="flex items-center justify-between">
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>{label}</div>
                <div className="flex items-center" style={{ gap: 8 }}>
                  <span style={{ fontSize: 12, color: "#9a93c0" }}>{timeLabel(r.t)}</span>
                  <span style={{ fontWeight: 800, fontSize: 14, color: scoreColor(r.correct, r.total) }}>{r.correct}/{r.total}</span>
                </div>
              </div>
              {r.wrong && r.wrong.length > 0 ? (
                <div style={{ marginTop: 8, borderTop: "1px dashed #ede9f8", paddingTop: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.coral, marginBottom: 4 }}>Mistakes:</div>
                  {r.wrong.map((w, j) => (<div key={j} style={{ fontSize: 12.5, color: "#4a4470", marginBottom: 3 }}><b>{w.topic}</b> — {w.q} <span style={{ color: C.grass }}>→ {w.a}</span></div>))}
                </div>
              ) : (<div style={{ marginTop: 6, fontSize: 12.5, color: C.grass, fontWeight: 700 }}>✓ No mistakes!</div>)}
            </div>
          );})}
        </div>
      );})}

      {log.length > 0 && (<button onClick={() => { if (window.confirm("Clear all history?")) onClear(); }} className="tap" style={{ width:"100%", background:"#fff", color:C.coral, border:"2px solid #f3d7d7", borderRadius:14, padding:"12px", fontWeight:700, cursor:"pointer", fontFamily:"inherit", fontSize:14 }}>Clear history</button>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
