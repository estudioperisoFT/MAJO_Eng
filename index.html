/*

  · Inglés didáctico · ilustraciones · sin pistas.
  · Today's session + Progress (historial) + racha.
  · Ejercicios generados al vuelo (misma lógica, contenido distinto cada vez).
  · Sin distractores que sólo cambian por el apóstrofo (isnt/isn't).
  · NUEVO: siempre se puede iniciar una sesión nueva; cada sesión queda
    numerada en el historial (Session 1, Session 2…) y no se borra ninguna.
  · Mantiene las claves de guardado "v5" para conservar el progreso ya hecho.
*/

};
function Icon({ name, size = 64 }) {
  if (!ICON[name]) return null;
  return <span style={{ display: "inline-flex", lineHeight: 0 }} dangerouslySetInnerHTML={{ __html: `<svg viewBox="0 0 100 100" width="${size}" height="${size}">${ICON[name]}</svg>` }} />;
}

// ---------- utilidades aleatorias ----------
const pick = (a) => a[(Math.random() * a.length) | 0];
const coin = () => Math.random() < 0.5;
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [b[i], b[j]] = [b[j], b[i]]; } return b; }
const pickBut = (a, notVal) => { let x = pick(a); let g = 0; while (x === notVal && g++ < 20) x = pick(a); return x; };
const sig = (q) => (q.text || q.context || "") + "|" + q.answer + "|" + (q.pics ? q.pics.join(",") : "") + "|" + (q.swatch || "");

// ---------- bancos de contenido ----------
const SING = [ {w:"park",icon:"tree"}, {w:"castle",icon:"castle"}, {w:"shop",icon:"shop"}, {w:"school",icon:"house"}, {w:"hospital",icon:"house"}, {w:"station",icon:"house"} ];
const PLUR = [ {w:"shops",icon:"shop"}, {w:"cars",icon:"car"}, {w:"buses",icon:"bus"}, {w:"parks",icon:"tree"}, {w:"houses",icon:"house"}, {w:"trees",icon:"tree"} ];
const FEEL = [ {w:"happy",icon:"facehappy"}, {w:"sad",icon:"facesad"}, {w:"hungry",icon:"facehungry"}, {w:"scared",icon:"facescared"}, {w:"angry",icon:"faceangry"} ];
const LIKEABLE = [ {w:"pizza"}, {w:"apples",icon:"apple"}, {w:"football",icon:"football"}, {w:"dogs",icon:"dog"}, {w:"soup"}, {w:"bananas"} ];
const ACTIONS = [ {w:"swim",icon:"swim"}, {w:"ride a bike",icon:"bike"}, {w:"run"}, {w:"dance"}, {w:"jump"}, {w:"sing"} ];
const HAVE = [ {w:"a dog",icon:"dog"}, {w:"a bike",icon:"bike"}, {w:"a necklace",icon:"necklace"}, {w:"a ball",icon:"football"} ];
const PLACES = ["Argentina","Spain","Peru","Egypt"];
const VEH = [ {s:"car",p:"cars",icon:"car"}, {s:"bus",p:"buses",icon:"bus"}, {s:"train",p:"trains",icon:"train"}, {s:"plane",p:"planes",icon:"plane"}, {s:"lorry",p:"lorries",icon:"lorry"}, {s:"motorbike",p:"motorbikes",icon:"motorbike"}, {s:"bike",p:"bikes",icon:"bike"} ];
const JOBS = [ {w:"cook",icon:"chefhat"}, {w:"scientist",icon:"flask"}, {w:"football player",icon:"football"} ];
const MONTHS = ["January","March","May","July","September","December"];
const NAMES = ["Sara","Mia","Tom","Lily","Ben","Nina"];
const SPELL = [
  {w:"castle",icon:"castle",d:["castel","casle"]}, {w:"painting",icon:"painting",d:["paiting","paintin"]},
  {w:"scientist",icon:"flask",d:["sientist","scientistc"]}, {w:"brother",icon:"boy",d:["broder","bruther"]},
  {w:"necklace",icon:"necklace",d:["neclace","netcklace"]}, {w:"dinosaur",icon:"dinosaur",d:["dinosor","dinasaur"]},
  {w:"football",icon:"football",d:["footbal","futbol"]}, {w:"basketball",icon:"basketball",d:["basketbal","basketbol"]},
  {w:"apple",icon:"apple",d:["aple","appel"]}, {w:"dog",icon:"dog",d:["dogg","dug"]},
  {w:"bike",icon:"bike",d:["biek","byke"]}, {w:"house",icon:"house",d:["hous","howse"]},
  {w:"train",icon:"train",d:["tran","trian"]}, {w:"plane",icon:"plane",d:["plaen","plan"]},
  {w:"green",swatch:"#34BE6B",d:["gren","grean"]}, {w:"orange",swatch:"#FF8A3D",d:["orage","orenge"]}, {w:"yellow",swatch:"#FFC233",d:["yellou","yelow"]},
];

// ---------- generadores (una pregunta por llamada) ----------
function oneThereIs() {
  if (coin()) { // singular
    const pl = pick(SING), yes = coin();
    const answer = yes ? "Yes, there is." : "No, there isn't.";
    const other = yes ? "Yes, there are." : "No, there aren't.";
    return { pics:[pl.icon], badge: yes?"yes":"no", text:`Is there a ${pl.w}?`, options: shuffle([answer, other]), answer, tip:"One thing → there is / there isn't." };
  } else { // plural
    const pl = pick(PLUR), yes = coin();
    const answer = yes ? "Yes, there are." : "No, there aren't.";
    const other = yes ? "Yes, there is." : "No, there isn't.";
    return { pics:[pl.icon, pl.icon], badge: yes?"yes":"no", text:`Are there any ${pl.w}?`, options: shuffle([answer, other]), answer, tip:"Many things → there are / there aren't." };
  }
}
function oneILike() {
  const t = (Math.random() * 5) | 0;
  if (t === 0) { const f = pick(FEEL); return { pics:[f.icon], text:`I ___ ${f.w}.`, options: shuffle(["I'm","I like"]), answer:"I'm", tip:"Use I'm for feelings: I'm happy." }; }
  if (t === 1) { const x = pick(LIKEABLE); return { pics: x.icon?[x.icon]:undefined, text:`I ___ ${x.w}.`, options: shuffle(["I like","I'm like"]), answer:"I like", tip:"Use I like with a word." }; }
  if (t === 2) { const a = pick(ACTIONS); return { pics: a.icon?[a.icon]:undefined, text:`I ___ ${a.w}.`, options: shuffle(["I can","I'm can"]), answer:"I can" }; }
  if (t === 3) { const o = pick(HAVE); return { pics: o.icon?[o.icon]:undefined, text:`I ___ ${o.w}.`, options: shuffle(["I've got","I'm have"]), answer:"I've got", tip:"I've got = I have." }; }
  const p = pick(PLACES); return { text:`I ___ from ${p}.`, options: shuffle(["I'm","I like"]), answer:"I'm", tip:"Use I'm from + place." };
}
function oneThisThese() {
  const v = pick(VEH), t = (Math.random() * 3) | 0;
  if (t === 0) return { pics:[v.icon], text:`___ a ${v.s}.`, options: shuffle(["This is","These are"]), answer:"This is", tip:"One → This is." };
  if (t === 1) return { pics:[v.icon, v.icon], text:`___ my ${v.p}.`, options: shuffle(["This is","These are"]), answer:"These are", tip:"Many → These are." };
  return { pics:[v.icon, v.icon], text:"These are my ___.", options: shuffle([v.s, v.p]), answer: v.p, tip:"Add -s for many." };
}
function oneSpell(word) {
  const s = word || pick(SPELL);
  const base = s.swatch ? { swatch: s.swatch } : { pics: [s.icon] };
  return { ...base, ask:"Which one is correct?", options: shuffle([s.w, s.d[0], s.d[1]]), answer: s.w };
}
function oneYesNo() {
  const pron = coin() ? "she" : "he", t = (Math.random() * 3) | 0;
  if (t === 2) { // has got
    const v = pick(VEH), yes = coin();
    const answer = yes ? `Yes, ${pron} has.` : `No, ${pron} hasn't.`;
    const opts = yes ? [answer, `Yes, ${pron} is.`, `No, ${pron} hasn't.`] : [answer, `Yes, ${pron} has.`, `No, ${pron} isn't.`];
    return { pics:[v.icon], badge: yes?"yes":"no", text:`Has ${pron} got a ${v.s}?`, options: shuffle([...new Set(opts)]), answer, tip:"Has … got? → Yes, … has." };
  }
  if (t === 1) { // job
    const j = pick(JOBS), match = coin();
    const askJob = match ? j.w : pickBut(JOBS, j).w;
    const yes = askJob === j.w;
    const answer = yes ? `Yes, ${pron} is.` : `No, ${pron} isn't.`;
    const opp = yes ? `No, ${pron} isn't.` : `Yes, ${pron} is.`;
    const otherP = pron === "she" ? "he" : "she";
    return { pics:[j.icon], text:`Is ${pron} a ${askJob}?`, options: shuffle([answer, opp, `${yes?"Yes":"No"}, ${otherP} ${yes?"is.":"isn't."}`]), answer };
  }
  // feeling
  const f = pick(FEEL), match = coin();
  const askF = match ? f.w : pickBut(FEEL, f).w;
  const yes = askF === f.w;
  const answer = yes ? `Yes, ${pron} is.` : `No, ${pron} isn't.`;
  const opp = yes ? `No, ${pron} isn't.` : `Yes, ${pron} is.`;
  const otherP = pron === "she" ? "he" : "she";
  return { pics:[f.icon], text:`Is ${pron} ${askF}?`, options: shuffle([answer, opp, `${yes?"Yes":"No"}, ${otherP} ${yes?"is.":"isn't."}`]), answer };
}
function oneQuestion() {
  const t = (Math.random() * 7) | 0; let context, correct, d;
  if (t === 0) { const n = pick(NAMES); context = `Friend: My name is ${n}.`; correct = "What's your name?"; d = ["What you name?","What name your?"]; }
  else if (t === 1) { const a = pick([7,8,9,10]); context = `Friend: I'm ${a}.`; correct = "How old are you?"; d = ["How old you are?","How you old?"]; }
  else if (t === 2) { const p = pick(PLACES); context = `Friend: I'm from ${p}.`; correct = "Where are you from?"; d = ["Where you from?","From where you?"]; }
  else if (t === 3) { const x = pick(["football","pizza","dogs","tennis"]); context = `Friend: Yes, I do. I like ${x}.`; correct = `Do you like ${x}?`; d = [`You like ${x}?`,`Like you ${x}?`]; }
  else if (t === 4) { const x = pick(["a dog","a bike","a watch"]); context = `Friend: Yes, I have. I've got ${x}.`; correct = `Have you got ${x}?`; d = [`You have ${x}?`,`Got you ${x}?`]; }
  else if (t === 5) { const m = pick(MONTHS); context = `Friend: It's in ${m}.`; correct = "When is your birthday?"; d = ["When your birthday?","When birthday you?"]; }
  else { const x = pick(["a t-shirt","a dress","shorts"]); context = `Friend: I'm wearing ${x}.`; correct = "What are you wearing?"; d = ["What you wearing?","What wearing you?"]; }
  return { context, ask:"Choose the question.", options: shuffle([correct, d[0], d[1]]), answer: correct };
}
function oneConnect() {
  const FD = ["pizza","soup","apples","bananas","chicken","rice"], t = (Math.random() * 6) | 0;
  if (t === 0) { const a = pick(FD), b = pickBut(FD, a); return { text:`I like ${a} ___ I don't like ${b}.`, options: shuffle(["and","but","or"]), answer:"but", tip:"A different idea → but." }; }
  if (t === 1) { const a = pick(FD), b = pickBut(FD, a); return { text:`I like ${a} ___ ${b}.`, options: shuffle(["and","but","or"]), answer:"and", tip:"Adding things → and." }; }
  if (t === 2) { const a = pick(FD), b = pickBut(FD, a); return { text:`I don't like ${a} ___ ${b}.`, options: shuffle(["and","but","or"]), answer:"or", tip:"After don't like → or." }; }
  if (t === 3) { const a = pick(ACTIONS).w, b = pickBut(ACTIONS.map(x=>x.w), a); return { text:`I can ${a} ___ I can't ${b}.`, options: shuffle(["and","but"]), answer:"but" }; }
  if (t === 4) { const a = pick(["ball","bike","dog","watch"]); const b = pickBut(["ball","bike","dog","watch"], a); return { text:`I've got a ${a} ___ I haven't got a ${b}.`, options: shuffle(["and","but"]), answer:"but" }; }
  const m1 = pick(MONTHS), m2 = pickBut(MONTHS, m1); return { text:`Is your birthday in ${m1} ___ in ${m2}?`, options: shuffle(["and","or"]), answer:"or" };
}

const GEN = { thereis: oneThereIs, ilike: oneILike, thisthese: oneThisThese, spell: oneSpell, yesno: oneYesNo, questions: oneQuestion, connect: oneConnect };

const MISSIONS = [
  { id:"thereis", emoji:"🏘️", name:"There is / There are", sub:"one is · many are" },
  { id:"ilike", emoji:"💬", name:"I like / I can / I've got", sub:"not 'I'm like'" },
  { id:"thisthese", emoji:"🚂", name:"This is / These are", sub:"one · many + s" },
  { id:"spell", emoji:"✏️", name:"Spelling Stars", sub:"look and choose" },
  { id:"yesno", emoji:"🙋", name:"Yes / No answers", sub:"look at the picture" },
  { id:"questions", emoji:"❓", name:"Make the question", sub:"word order" },
  { id:"connect", emoji:"🔗", name:"and / but / or", sub:"joining words" },
];
const MNAME = Object.fromEntries(MISSIONS.map((m) => [m.id, m.name]));
const MLEN = 8;

// genera un set único (sin repetir) para una misión
function genMission(id, n = MLEN) {
  const out = [], seen = new Set();
  if (id === "spell") { // sin repetir palabra
    const words = shuffle(SPELL).slice(0, Math.min(n, SPELL.length));
    return words.map((w) => ({ ...oneSpell(w), _id:id, _mission:MNAME[id] }));
  }
  let guard = 0;
  while (out.length < n && guard++ < n * 12) {
    const q = GEN[id](); const s = sig(q);
    if (!seen.has(s)) { seen.add(s); out.push({ ...q, _id:id, _mission:MNAME[id] }); }
  }
  return out;
}

const WEIGHTS = { thereis:3, thisthese:3, spell:3, ilike:2, yesno:2, questions:1, connect:1 };
function buildSession(n = 10) {
  const bag = []; Object.keys(WEIGHTS).forEach((id) => { for (let i = 0; i < WEIGHTS[id]; i++) bag.push(id); });
  const out = [], seen = new Set(); let guard = 0;
  while (out.length < n && guard++ < n * 14) {
    const id = pick(bag);
    const q = id === "spell" ? oneSpell() : GEN[id]();
    const s = sig(q);
    if (!seen.has(s)) { seen.add(s); out.push({ ...q, _id:id, _mission:MNAME[id] }); }
  }
  return out;
}

const todayStr = () => new Date().toISOString().slice(0, 10);
const yestStr = () => new Date(Date.now() - 86400000).toISOString().slice(0, 10);
const descQ = (q) => q.text ? q.text : q.context ? q.context : (q.answer ? "Spelling: " + q.answer : "—");
const packWrong = (arr) => arr.map((q) => ({ q: descQ(q), a: q.answer, topic: q._mission }));

const CHEERS = ["Great!", "Yes!", "Well done!", "Brilliant!", "Star!", "Super!"];

function StarSvg({ size = 28, face = false, color = C.sun, bounce = false }) {
  return (
    <span className="inline-flex items-center justify-center" style={{ animation: bounce ? "lumiBounce 0.6s ease" : "none", lineHeight: 1 }}>
      <svg width={size} height={size} viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 3l5.5 13.3L44 17.6l-10.8 9.3L36.6 41 24 33.5 11.4 41l3.4-14.1L4 17.6l14.5-1.3z" fill={color} stroke={C.ink} strokeWidth="2.2" strokeLinejoin="round" />
        {face && (<><circle cx="19" cy="22" r="2.3" fill={C.ink} /><circle cx="29" cy="22" r="2.3" fill={C.ink} /><path d="M19 27 q5 4 10 0" fill="none" stroke={C.ink} strokeWidth="2" strokeLinecap="round" /></>)}
      </svg>
    </span>
  );
}
function Badge({ kind }) {
  const yes = kind === "yes";
  return (<span style={{ position:"absolute", top:-6, right:-6, width:26, height:26, borderRadius:"50%", background: yes ? C.grass : C.coral, color:"#fff", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:800, fontSize:15, boxShadow:"0 2px 0 rgba(43,33,80,.2)" }}>{yes ? "✓" : "✗"}</span>);
}

function App() {
  const [screen, setScreen] = useState("home");
  const [best, setBest] = useState({});
  const [meta, setMeta] = useState({ streak: 0, lastDay: null, sessions: 0 });
  const [log, setLog] = useState([]);
  const [qs, setQs] = useState([]);
  const [title, setTitle] = useState("");
  const [isSession, setIsSession] = useState(false);
  const [missionId, setMissionId] = useState(null);
  const [retrying, setRetrying] = useState(false);
  const [first, setFirst] = useState({ correct: 0, total: 0, wrong: [] });
  const [finalCorrect, setFinalCorrect] = useState(0);
  const [finalTotal, setFinalTotal] = useState(0);

  useEffect(() => { (async () => {
    try { const r = await window.storage.get("majo-best-v5"); if (r && r.value) setBest(JSON.parse(r.value)); } catch (e) {}
    try { const r = await window.storage.get("majo-meta-v5"); if (r && r.value) setMeta(JSON.parse(r.value)); } catch (e) {}
    try { const r = await window.storage.get("majo-log-v5"); if (r && r.value) setLog(JSON.parse(r.value)); } catch (e) {}
  })(); }, []);
  const saveBest = async (n) => { setBest(n); try { await window.storage.set("majo-best-v5", JSON.stringify(n)); } catch (e) {} };
  const saveMeta = async (n) => { setMeta(n); try { await window.storage.set("majo-meta-v5", JSON.stringify(n)); } catch (e) {} };
  const addLog = async (rec) => { const n = [rec, ...log].slice(0, 400); setLog(n); try { await window.storage.set("majo-log-v5", JSON.stringify(n)); } catch (e) {} };
  const clearLog = async () => { setLog([]); try { await window.storage.set("majo-log-v5", JSON.stringify([])); } catch (e) {} };

  const totalStars = Object.values(best).reduce((a, b) => a + b, 0);
  const doneToday = meta.lastDay === todayStr();
  const todayCount = log.filter((r) => r.kind === "Today's session" && r.t.slice(0, 10) === todayStr()).length;

  const startMission = (id) => { setQs(genMission(id)); setTitle(MNAME[id]); setIsSession(false); setMissionId(id); setRetrying(false); setScreen("play"); };
  const startSession = () => { setQs(buildSession(10)); setTitle("Today's session"); setIsSession(true); setMissionId(null); setRetrying(false); setScreen("play"); };

  const closeSession = (c, t, wrongArr) => {
    const last = meta.lastDay; let streak = meta.streak || 0;
    if (last !== todayStr()) streak = (last === yestStr()) ? streak + 1 : 1;
    saveMeta({ streak, lastDay: todayStr(), sessions: (meta.sessions || 0) + 1 });
    addLog({ t: new Date().toISOString(), kind: "Today's session", correct: c, total: t, wrong: packWrong(wrongArr) });
    setFinalCorrect(c); setFinalTotal(t); setScreen("end");
  };
  const onFinish = (correct, total, wrong) => {
    if (isSession) {
      if (!retrying) { setFirst({ correct, total, wrong }); if (wrong.length > 0) { setRetrying(true); setQs(wrong); setTitle("Try again!"); return; } closeSession(correct, total, []); }
      else { closeSession(first.correct, first.total, first.wrong); }
    } else {
      const prev = best[missionId] || 0; if (correct > prev) saveBest({ ...best, [missionId]: correct });
      addLog({ t: new Date().toISOString(), kind: title, correct, total, wrong: packWrong(wrong) });
      setFinalCorrect(correct); setFinalTotal(total); setScreen("end");
    }
  };

  const bg = `radial-gradient(120% 90% at 50% 0%, ${C.sky2} 0%, ${C.sky1} 60%, #B9C8FF 100%)`;
  return (
    <div className="min-h-screen w-full flex justify-center" style={{ background: bg, fontFamily: "'Fredoka','Baloo 2','Trebuchet MS',system-ui,sans-serif", color: C.ink, padding: "16px" }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');
        @keyframes lumiBounce{0%{transform:translateY(0) scale(1)}30%{transform:translateY(-10px) scale(1.15)}60%{transform:translateY(0) scale(.96)}100%{transform:translateY(0) scale(1)}}
        @keyframes floatUp{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-90px) scale(1.1);opacity:0}}
        @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
        @keyframes popIn{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
        @media (prefers-reduced-motion: reduce){*{animation:none!important}}
        .tap{transition:transform .08s ease, box-shadow .12s ease;} .tap:active{transform:translateY(2px);}
        .opt:focus-visible{outline:3px solid ${C.grape};outline-offset:2px;}
      `}</style>

      <div className="w-full" style={{ maxWidth: 440 }}>
        <div className="flex items-center justify-between" style={{ marginBottom: 14 }}>
          <div className="flex items-center" style={{ gap: 8 }}><StarSvg size={30} face /><span style={{ fontWeight: 700, fontSize: 22 }}>Star English</span></div>
          <div className="flex items-center" style={{ gap: 6, background:"#fff", borderRadius:999, padding:"6px 12px", boxShadow:"0 3px 0 rgba(43,33,80,.15)", fontWeight:700 }}><StarSvg size={20} /> <span style={{ fontSize: 16 }}>{totalStars}</span></div>
        </div>

        {screen === "home" && <Home best={best} meta={meta} doneToday={doneToday} todayCount={todayCount} onStart={startMission} onSession={startSession} onProgress={() => setScreen("progress")} />}
        {screen === "play" && <Play qs={qs} title={title} isSession={isSession} onFinish={onFinish} onHome={() => setScreen("home")} />}
        {screen === "end" && <End isSession={isSession} title={title} correct={finalCorrect} total={finalTotal} streak={meta.streak} onAgain={() => (isSession ? startSession() : startMission(missionId))} onHome={() => setScreen("home")} onProgress={() => setScreen("progress")} />}
        {screen === "progress" && <Progress log={log} meta={meta} totalStars={totalStars} onClear={clearLog} onHome={() => setScreen("home")} />}

        <div style={{ textAlign: "center", marginTop: 14, fontSize: 11, color: "#9a93c0" }}>Star English · {VERSION}</div>
      </div>
    </div>
  );
}

function Home({ best, meta, doneToday, todayCount, onStart, onSession, onProgress }) {
  return (
    <div style={{ animation: "popIn .25s ease" }}>
      <div className="flex items-center" style={{ gap: 12, background:"#fff", borderRadius:22, padding:"14px 16px", marginBottom:12, boxShadow:"0 4px 0 rgba(43,33,80,.12)" }}>
        <StarSvg size={42} face bounce />
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 700, fontSize: 19 }}>Hi Majo! 👋</div>
          <div style={{ fontSize: 13.5, color: "#6a6390" }}>{meta.streak > 0 ? `🔥 ${meta.streak}-day streak` : "Let's start a streak! 🔥"}</div>
        </div>
        <button onClick={onProgress} className="tap" style={{ border:"none", background:"#F2EFFF", color:C.grape, fontWeight:800, borderRadius:14, padding:"8px 12px", cursor:"pointer", fontSize:13 }}>📊 Progress</button>
      </div>

      <button onClick={onSession} className="tap opt" style={{ width:"100%", textAlign:"left", border:"none", borderRadius:22, padding:"16px 18px", cursor:"pointer", color:"#fff", background:`linear-gradient(135deg, ${C.grape}, #8a6bff)`, boxShadow:`0 5px 0 ${C.grapeDark}`, marginBottom:16, display:"flex", alignItems:"center", gap:14 }}>
        <div style={{ fontSize: 34 }}>{doneToday ? "🌟" : "⭐"}</div>
        <div style={{ flex: 1 }}>
          <div style={{ fontWeight: 800, fontSize: 18 }}>{doneToday ? "New session" : "Today's session"}</div>
          <div style={{ fontSize: 13, opacity: .92 }}>{doneToday ? `${todayCount} done today — start another! · 10 new questions` : "10 new questions · 3–5 min"}</div>
        </div>
        <div style={{ fontSize: 22 }}>▶</div>
      </button>

      <div style={{ fontSize: 13, fontWeight: 700, color: "#6a6390", margin: "0 2px 8px" }}>Or practise one thing:</div>
      <div className="grid" style={{ gridTemplateColumns: "1fr 1fr", gap: 12 }}>
        {MISSIONS.map((m) => {
          const b = best[m.id] || 0;
          return (
            <button key={m.id} onClick={() => onStart(m.id)} className="tap opt" style={{ textAlign:"left", background:"#fff", border:"none", borderRadius:20, padding:14, cursor:"pointer", boxShadow:"0 4px 0 rgba(43,33,80,.12)", display:"flex", flexDirection:"column", gap:6, minHeight:120 }}>
              <div style={{ fontSize: 28 }}>{m.emoji}</div>
              <div style={{ fontWeight: 700, fontSize: 14, lineHeight: 1.1 }}>{m.name}</div>
              <div style={{ fontSize: 11.5, color: "#7a7398", flex: 1 }}>{m.sub}</div>
              <div className="flex items-center" style={{ gap: 4, fontSize: 12, fontWeight: 700, color: b ? C.grape : "#b9b4cf" }}><StarSvg size={15} color={b ? C.sun : "#dcd8ee"} /> best {b}/{MLEN}</div>
            </button>
          );
        })}
      </div>
    </div>
  );
}

function Play({ qs, title, isSession, onFinish, onHome }) {
  const [qi, setQi] = useState(0);
  const [picked, setPicked] = useState(null);
  const [correct, setCorrect] = useState(0);
  const [wrong, setWrong] = useState([]);
  const [cheer, setCheer] = useState("");
  const [pop, setPop] = useState(false);
  useEffect(() => { setQi(0); setPicked(null); setCorrect(0); setWrong([]); setCheer(""); }, [qs]);

  const q = qs[qi]; if (!q) return null;
  const total = qs.length;
  const isRight = picked && picked === q.answer;
  const isWrong = picked && picked !== q.answer;
  const ask = q._ask || q.ask;

  const choose = (opt) => {
    if (picked) return;
    setPicked(opt);
    if (opt === q.answer) { setCorrect((c) => c + 1); setCheer(CHEERS[Math.floor(Math.random() * CHEERS.length)]); setPop(true); setTimeout(() => setPop(false), 650); }
    else { setWrong((w) => [...w, q]); setCheer("Almost! Look →"); }
  };
  const next = () => { if (qi + 1 < total) { setQi(qi + 1); setPicked(null); setCheer(""); } else { onFinish(correct, total, wrong); } };

  return (
    <div style={{ animation: "popIn .2s ease" }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 10 }}>
        <button onClick={onHome} className="tap" style={{ border:"none", background:"#fff", borderRadius:999, width:40, height:40, cursor:"pointer", fontSize:18, boxShadow:"0 3px 0 rgba(43,33,80,.12)" }}>←</button>
        <div className="flex items-center" style={{ gap: 5 }}>{Array.from({ length: total }).map((_, i) => (<span key={i} style={{ width: 9, height: 9, borderRadius: 99, background: i < qi ? C.grass : i === qi ? C.grape : "#fff", boxShadow:"0 2px 0 rgba(43,33,80,.1)" }} />))}</div>
        <div style={{ fontWeight: 700, fontSize: 14, width: 40, textAlign: "right" }}>{qi + 1}/{total}</div>
      </div>

      {isSession && <div style={{ textAlign: "center", fontSize: 12.5, fontWeight: 700, color: C.grape, marginBottom: 6 }}>{title}{q._mission ? ` · ${q._mission}` : ""}</div>}

      <div className="flex items-center" style={{ gap: 10, minHeight: 44, marginBottom: 8 }}>
        <StarSvg size={38} face bounce={pop} color={isWrong ? C.coral : C.sun} />
        <div style={{ fontWeight: 700, fontSize: 17, color: isRight ? C.grass : isWrong ? C.coral : C.ink, position: "relative" }}>
          {cheer || (isSession ? "Keep going!" : title)}
          {pop && (<span style={{ position: "absolute", left: 18, top: -6 }}>{["⭐","✨","⭐"].map((s, i) => (<span key={i} style={{ position: "absolute", left: i * 16, animation: "floatUp .65s ease forwards", animationDelay: `${i * 60}ms` }}>{s}</span>))}</span>)}
        </div>
      </div>

      <div style={{ background:"#fff", borderRadius:24, padding:18, boxShadow:"0 5px 0 rgba(43,33,80,.12)", animation: isWrong ? "shake .4s ease" : "none", marginBottom:14 }}>
        {q.pics && (<div style={{ display:"flex", justifyContent:"center", alignItems:"center", gap:10, marginBottom:8 }}><span style={{ position:"relative", display:"inline-flex", gap:6 }}>{q.pics.map((n, i) => <Icon key={i} name={n} size={66} />)}{q.badge && <Badge kind={q.badge} />}</span></div>)}
        {q.swatch && (<div style={{ display:"flex", justifyContent:"center", marginBottom:8 }}><span style={{ width:56, height:56, borderRadius:"50%", background:q.swatch, border:"3px solid #2B2150" }} /></div>)}
        {q.context && <div style={{ fontSize:16, textAlign:"center", color:"#5a5482", marginBottom:6 }}>{q.context}</div>}
        {ask && <div style={{ fontSize:14.5, color:"#6a6390", textAlign:"center", marginBottom: q.text ? 4 : 0 }}>{ask}</div>}
        {q.text && <div style={{ fontSize:21, fontWeight:600, textAlign:"center", lineHeight:1.3 }}>{q.text}</div>}
      </div>

      <div className="flex" style={{ flexDirection: "column", gap: 10 }}>
        {q.options.map((opt) => {
          let bg = "#fff", fg = C.ink, shadow = "0 4px 0 rgba(43,33,80,.14)", border = "3px solid #fff";
          if (picked) {
            if (opt === q.answer) { bg = C.grass; fg = "#fff"; shadow = "0 4px 0 #259652"; border = `3px solid ${C.grass}`; }
            else if (opt === picked) { bg = C.coral; fg = "#fff"; shadow = "0 4px 0 #d94f4f"; border = `3px solid ${C.coral}`; }
            else { fg = "#b4afca"; }
          }
          return (<button key={opt} className="tap opt" onClick={() => choose(opt)} disabled={!!picked} style={{ background:bg, color:fg, border, borderRadius:16, padding:"15px 16px", fontSize:18, fontWeight:600, cursor: picked ? "default" : "pointer", boxShadow:shadow, fontFamily:"inherit" }}>{opt}</button>);
        })}
      </div>

      {picked && (
        <div style={{ marginTop: 14, animation: "popIn .2s ease" }}>
          {isWrong && <div style={{ textAlign: "center", fontWeight: 600, marginBottom: 8 }}>✅ {q.answer}</div>}
          {q.tip && <div style={{ background:"#FFF6DC", border:`2px solid ${C.sun}`, borderRadius:14, padding:"10px 12px", fontSize:13.5, textAlign:"center", marginBottom:10 }}>💡 {q.tip}</div>}
          <button onClick={next} className="tap" style={{ width:"100%", background:C.grape, color:"#fff", border:"none", borderRadius:16, padding:"15px", fontSize:18, fontWeight:700, cursor:"pointer", boxShadow:`0 4px 0 ${C.grapeDark}`, fontFamily:"inherit" }}>{qi + 1 < total ? "Next →" : "Finish ⭐"}</button>
        </div>
      )}
    </div>
  );
}

function End({ isSession, title, correct, total, streak, onAgain, onHome, onProgress }) {
  const perfect = correct === total, good = correct >= Math.ceil(total * 0.6);
  const msg = perfect ? "Perfect! 🌟" : good ? "Great job! 👏" : "Good try! 💪";
  return (
    <div style={{ textAlign: "center", animation: "popIn .25s ease" }}>
      <div style={{ background:"#fff", borderRadius:26, padding:"26px 18px", boxShadow:"0 5px 0 rgba(43,33,80,.12)", marginTop:10 }}>
        <StarSvg size={70} face bounce />
        <div style={{ fontWeight: 700, fontSize: 24, marginTop: 8 }}>{msg}</div>
        <div style={{ fontSize: 16, color: "#6a6390", marginTop: 4 }}>{isSession ? "Session complete" : title}</div>
        <div className="flex items-center justify-center" style={{ gap: 6, marginTop: 14, flexWrap: "wrap" }}>{Array.from({ length: total }).map((_, i) => (<StarSvg key={i} size={20} color={i < correct ? C.sun : "#e3dff3"} />))}</div>
        <div style={{ fontWeight: 700, fontSize: 20, marginTop: 10 }}>{correct} / {total} ⭐</div>
        {isSession && streak > 0 && <div style={{ marginTop: 10, fontWeight: 800, fontSize: 17, color: C.coral }}>🔥 {streak}-day streak!</div>}
      </div>
      <div className="flex" style={{ gap: 10, marginTop: 14 }}>
        <button onClick={onAgain} className="tap" style={{ flex:1, background:C.grape, color:"#fff", border:"none", borderRadius:16, padding:"15px", fontSize:17, fontWeight:700, cursor:"pointer", boxShadow:`0 4px 0 ${C.grapeDark}`, fontFamily:"inherit" }}>{isSession ? "New session" : "New questions ↻"}</button>
        <button onClick={onHome} className="tap" style={{ flex:1, background:"#fff", color:C.ink, border:"none", borderRadius:16, padding:"15px", fontSize:17, fontWeight:700, cursor:"pointer", boxShadow:"0 4px 0 rgba(43,33,80,.14)", fontFamily:"inherit" }}>Home</button>
      </div>
      <button onClick={onProgress} className="tap" style={{ marginTop:10, background:"transparent", border:"none", color:C.grape, fontWeight:700, cursor:"pointer", fontSize:14 }}>📊 See progress</button>
    </div>
  );
}

function Progress({ log, meta, totalStars, onClear, onHome }) {
  const dayLabel = (iso) => { const d = iso.slice(0, 10); if (d === todayStr()) return "Today"; if (d === yestStr()) return "Yesterday"; return d; };
  const timeLabel = (iso) => { try { return new Date(iso).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); } catch (e) { return ""; } };
  const groups = []; const idx = {};
  log.forEach((r) => { const d = r.t.slice(0, 10); if (!(d in idx)) { idx[d] = groups.length; groups.push({ d, items: [] }); } groups[idx[d]].items.push(r); });
  const scoreColor = (c, t) => (c === t ? C.grass : c >= Math.ceil(t * 0.6) ? C.sun : C.coral);

  return (
    <div style={{ animation: "popIn .2s ease" }}>
      <div className="flex items-center justify-between" style={{ marginBottom: 12 }}>
        <button onClick={onHome} className="tap" style={{ border:"none", background:"#fff", borderRadius:999, width:40, height:40, cursor:"pointer", fontSize:18, boxShadow:"0 3px 0 rgba(43,33,80,.12)" }}>←</button>
        <div style={{ fontWeight: 800, fontSize: 19 }}>Progress</div>
        <div style={{ width: 40 }} />
      </div>

      <div className="flex" style={{ gap: 10, marginBottom: 14 }}>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.coral }}>🔥 {meta.streak || 0}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>day streak</div></div>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.grape }}>{meta.sessions || 0}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>sessions</div></div>
        <div style={{ flex:1, background:"#fff", borderRadius:16, padding:"12px", textAlign:"center", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}><div style={{ fontSize:22, fontWeight:800, color:C.sun }}>★ {totalStars}</div><div style={{ fontSize:11.5, color:"#6a6390" }}>best stars</div></div>
      </div>

      {log.length === 0 && (<div style={{ background:"#fff", borderRadius:18, padding:"24px 16px", textAlign:"center", color:"#7a7398", boxShadow:"0 4px 0 rgba(43,33,80,.1)" }}>No activity yet.<br/>Do a session and it will show here! ⭐</div>)}

      {groups.map((g) => {
        const sessTotal = g.items.filter((r) => r.kind === "Today's session").length;
        let sSeen = 0;
        return (
        <div key={g.d} style={{ marginBottom: 16 }}>
          <div style={{ fontWeight: 800, fontSize: 14, color: "#6a6390", margin: "0 2px 8px" }}>{dayLabel(g.items[0].t)}</div>
          {g.items.map((r, i) => {
            const label = r.kind === "Today's session" ? `⭐ Session ${sessTotal - (sSeen++)}` : r.kind;
            return (
            <div key={i} style={{ background:"#fff", borderRadius:16, padding:"12px 14px", marginBottom:8, boxShadow:"0 3px 0 rgba(43,33,80,.1)" }}>
              <div className="flex items-center justify-between">
                <div style={{ fontWeight: 700, fontSize: 14.5 }}>{label}</div>
                <div className="flex items-center" style={{ gap: 8 }}>
                  <span style={{ fontSize: 12, color: "#9a93c0" }}>{timeLabel(r.t)}</span>
                  <span style={{ fontWeight: 800, fontSize: 14, color: scoreColor(r.correct, r.total) }}>{r.correct}/{r.total}</span>
                </div>
              </div>
              {r.wrong && r.wrong.length > 0 ? (
                <div style={{ marginTop: 8, borderTop: "1px dashed #ede9f8", paddingTop: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 700, color: C.coral, marginBottom: 4 }}>Mistakes:</div>
                  {r.wrong.map((w, j) => (<div key={j} style={{ fontSize: 12.5, color: "#4a4470", marginBottom: 3 }}><b>{w.topic}</b> — {w.q} <span style={{ color: C.grass }}>→ {w.a}</span></div>))}
                </div>
              ) : (<div style={{ marginTop: 6, fontSize: 12.5, color: C.grass, fontWeight: 700 }}>✓ No mistakes!</div>)}
            </div>
          );})}
        </div>
      );})}

      {log.length > 0 && (<button onClick={() => { if (window.confirm("Clear all history?")) onClear(); }} className="tap" style={{ width:"100%", background:"#fff", color:C.coral, border:"2px solid #f3d7d7", borderRadius:14, padding:"12px", fontWeight:700, cursor:"pointer", fontFamily:"inherit", fontSize:14 }}>Clear history</button>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
